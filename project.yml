name: JarvisTalk
options:
  bundleIdPrefix: com.jarvis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  JarvisCore:
    path: Packages/JarvisCore
targets:
  JarvisTalk:
    type: application
    platform: iOS
    sources:
      - path: JarvisTalk
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: JarvisCore
        product: JarvisCore
      - package: JarvisCore
        product: JarvisNet
      - package: JarvisCore
        product: JarvisModel
    info:
      path: JarvisTalk/Resources/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        # keeps the voice call running with the phone locked (an active .playAndRecord audio session is what holds it)
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Jarvis needs the microphone so you can talk to him. Audio is only sent to your own Jarvis server while a call is on.
        NSCameraUsageDescription: Jarvis uses the camera when you choose to take a photo or video to send to him.
        NSPhotoLibraryUsageDescription: Jarvis watches your photo library for new screenshots (for example after a triple-tap on the back of the phone) and sends them to your own Jarvis server. Nothing else is read or sent, and you can turn it off in Jarvis Settings.
        NSPhotoLibraryAddUsageDescription: Jarvis saves camera snapshots to your photo library only when you tap Save.
        NSLocalNetworkUsageDescription: Jarvis connects to your Jarvis server, which may be on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.talk.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
